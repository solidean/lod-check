name: build

# Every push builds all three; a v* tag also publishes them as a release, so every download traces back to its source.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Builds only read; the release job asks for what publishing and attesting need.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2022
            binary: build/Release/lod-check.exe
          # 22.04's glibc keeps the binary running on older distributions; gcc 13 brings std::format.
          - name: linux-x64
            os: ubuntu-22.04
            binary: build/lod-check
          # Universal, so Intel Macs with AMD GPUs report too; CMakeLists.txt's deployment target keeps it running on macOS 14.
          - name: macos-universal
            os: macos-15
            binary: build/lod-check
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install gcc 13
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y g++-13
          echo "CXX=g++-13" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          extra=()
          if [ "$RUNNER_OS" = "macOS" ]; then extra+=("-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"); fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "${extra[@]}"

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: bash
        run: |
          mkdir -p dist/lod-check
          cp "${{ matrix.binary }}" README.md LICENSE dist/lod-check/
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "lod-check-${{ matrix.name }}.zip" lod-check
          else
            zip -r "lod-check-${{ matrix.name }}.zip" lod-check
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: lod-check-${{ matrix.name }}
          path: dist/lod-check-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release
      id-token: write     # sign the provenance
      attestations: write # store it
    steps:
      - uses: actions/checkout@v5

      # The binaries report the version in CMakeLists.txt, so a tag that disagrees would ship mislabeled downloads.
      - name: Tag matches the CMake version
        run: |
          cmake_version=$(sed -nE 's/^project\(lod-check VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          if [ "v$cmake_version" != "${{ github.ref_name }}" ]; then
            echo "::error::tag ${{ github.ref_name }} does not match CMakeLists.txt's version $cmake_version"
            exit 1
          fi

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum *.zip > SHA256SUMS && cat SHA256SUMS

      # Lets anyone check a download came from this repository's workflow:
      # gh attestation verify lod-check-<platform>.zip --repo <owner>/lod-check
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*.zip

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.zip dist/SHA256SUMS --repo "${{ github.repository }}" --title "lod-check ${{ github.ref_name }}" --generate-notes
